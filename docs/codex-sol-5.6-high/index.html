<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="prefetch" href="../codex-luna-6/?v=8c0c7e7647" as="document"><link rel="prefetch" href="../codex-sol-6.1-high/?v=8c0c7e7647" as="document">
  <meta charset="UTF-8">
  
  <title>Low-Poly Running Horse</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #b8d8e8; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8d8e8);
scene.fog = new THREE.Fog(0xb8d8e8, 18, 48);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9, 4.7, 11);
camera.lookAt(0, 2.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaf8ff, 0x6c7750, 2.2));

const sun = new THREE.DirectionalLight(0xfff1cf, 4);
sun.position.set(7, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -5;
sun.shadow.bias = -0.0008;
scene.add(sun);

const horseMaterial = new THREE.MeshStandardMaterial({
  color: 0x9b5534,
  roughness: 0.9,
  flatShading: true
});
const darkMaterial = new THREE.MeshStandardMaterial({
  color: 0x2d1c18,
  roughness: 1,
  flatShading: true
});
const muzzleMaterial = new THREE.MeshStandardMaterial({
  color: 0xb97858,
  roughness: 1,
  flatShading: true
});
const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0x090707,
  roughness: 0.7
});
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x78945a,
  roughness: 1,
  flatShading: true
});

function mesh(geometry, material, parent, position, rotation = [0, 0, 0]) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(...position);
  object.rotation.set(...rotation);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function taperedCylinder(top, bottom, height, segments = 6) {
  return new THREE.CylinderGeometry(top, bottom, height, segments, 1, false);
}

const horse = new THREE.Group();
horse.rotation.y = -0.12;
horse.position.y = 0.02;
scene.add(horse);

const bodyRig = new THREE.Group();
bodyRig.position.y = 2.48;
horse.add(bodyRig);

const body = mesh(
  new THREE.DodecahedronGeometry(1, 0),
  horseMaterial,
  bodyRig,
  [0, 0, 0]
);
body.scale.set(1.75, 0.82, 0.68);

const chest = mesh(
  new THREE.DodecahedronGeometry(0.72, 0),
  horseMaterial,
  bodyRig,
  [1.15, 0.02, 0]
);
chest.scale.set(0.95, 1.05, 0.92);

const rump = mesh(
  new THREE.DodecahedronGeometry(0.76, 0),
  horseMaterial,
  bodyRig,
  [-1.18, 0.04, 0]
);
rump.scale.set(1.02, 1.02, 0.94);

const neckRig = new THREE.Group();
neckRig.position.set(1.25, 0.33, 0);
neckRig.rotation.z = -0.44;
bodyRig.add(neckRig);

mesh(
  taperedCylinder(0.38, 0.58, 1.55, 6),
  horseMaterial,
  neckRig,
  [0, 0.72, 0],
  [0, 0, 0]
);

const headRig = new THREE.Group();
headRig.position.set(0, 1.43, 0);
headRig.rotation.z = 0.48;
neckRig.add(headRig);

const head = mesh(
  new THREE.DodecahedronGeometry(0.52, 0),
  horseMaterial,
  headRig,
  [0.28, 0.12, 0]
);
head.scale.set(1.05, 0.82, 0.72);

const muzzle = mesh(
  new THREE.BoxGeometry(0.72, 0.43, 0.55, 1, 1, 1),
  muzzleMaterial,
  headRig,
  [0.72, -0.05, 0],
  [0, 0, -0.08]
);
muzzle.geometry.translate(0.15, 0, 0);

for (const side of [-1, 1]) {
  mesh(
    new THREE.SphereGeometry(0.055, 6, 4),
    eyeMaterial,
    headRig,
    [0.25, 0.3, side * 0.43]
  );

  const ear = mesh(
    new THREE.ConeGeometry(0.13, 0.48, 4),
    horseMaterial,
    headRig,
    [-0.04, 0.67, side * 0.28],
    [0.05, 0, side * -0.12]
  );
  ear.scale.z = 0.75;
}

for (let i = 0; i < 7; i++) {
  const manePiece = mesh(
    new THREE.ConeGeometry(0.18 - i * 0.008, 0.5, 4),
    darkMaterial,
    neckRig,
    [-0.34, 0.32 + i * 0.18, 0],
    [0, 0, Math.PI / 2]
  );
  manePiece.scale.z = 0.75;
}

const tailRig = new THREE.Group();
tailRig.position.set(-1.75, 0.25, 0);
tailRig.rotation.z = 1.1;
bodyRig.add(tailRig);

const tailSegments = [];
let tailParent = tailRig;
for (let i = 0; i < 5; i++) {
  const segmentRig = new THREE.Group();
  segmentRig.position.y = i === 0 ? 0 : -0.5;
  tailParent.add(segmentRig);

  mesh(
    taperedCylinder(0.14 - i * 0.014, 0.17 - i * 0.014, 0.62, 5),
    darkMaterial,
    segmentRig,
    [0, -0.3, 0]
  );

  tailSegments.push(segmentRig);
  tailParent = segmentRig;
}

const legs = [];
const legData = [
  { name: "frontNear", x: 1.15, z: 0.43, phase: 0.00 },
  { name: "frontFar",  x: 1.15, z: -0.43, phase: Math.PI },
  { name: "rearNear",  x: -1.12, z: 0.43, phase: Math.PI },
  { name: "rearFar",   x: -1.12, z: -0.43, phase: 0.00 }
];

function createLeg(data) {
  const hip = new THREE.Group();
  hip.position.set(data.x, -0.45, data.z);
  bodyRig.add(hip);

  const upperLength = 0.93;
  const lowerLength = 0.96;

  mesh(
    taperedCylinder(0.18, 0.24, upperLength, 5),
    horseMaterial,
    hip,
    [0, -upperLength / 2, 0]
  );

  const knee = new THREE.Group();
  knee.position.y = -upperLength;
  hip.add(knee);

  mesh(
    new THREE.DodecahedronGeometry(0.2, 0),
    horseMaterial,
    knee,
    [0, 0, 0]
  );

  mesh(
    taperedCylinder(0.105, 0.15, lowerLength, 5),
    horseMaterial,
    knee,
    [0, -lowerLength / 2, 0]
  );

  const hoof = mesh(
    new THREE.BoxGeometry(0.38, 0.22, 0.31),
    darkMaterial,
    knee,
    [0.1, -lowerLength - 0.03, 0],
    [0, 0, -0.09]
  );
  hoof.geometry.translate(0.07, 0, 0);

  const leg = { ...data, hip, knee, hoof };
  legs.push(leg);
  return leg;
}

legData.forEach(createLeg);

const ground = mesh(
  new THREE.PlaneGeometry(80, 80),
  groundMaterial,
  scene,
  [0, 0, 0],
  [-Math.PI / 2, 0, 0]
);
ground.castShadow = false;

const stripeMaterial = new THREE.MeshStandardMaterial({
  color: 0x657f4d,
  roughness: 1,
  flatShading: true
});
const stripes = [];
for (let i = 0; i < 18; i++) {
  const stripe = mesh(
    new THREE.PlaneGeometry(0.12, 14),
    stripeMaterial,
    scene,
    [-12 + i * 1.55, 0.006, 0],
    [-Math.PI / 2, 0, 0]
  );
  stripe.castShadow = false;
  stripes.push(stripe);
}

const distantMaterial = new THREE.MeshStandardMaterial({
  color: 0x839b78,
  roughness: 1,
  flatShading: true
});
for (let i = 0; i < 11; i++) {
  const hill = mesh(
    new THREE.ConeGeometry(3 + (i % 3), 4 + (i % 4), 6),
    distantMaterial,
    scene,
    [-22 + i * 4.5, 1.2, -15 - (i % 3) * 2]
  );
  hill.scale.z = 0.7;
  hill.castShadow = false;
  hill.receiveShadow = false;
}

const clock = new THREE.Clock();
const cycleDuration = 1.08;
const tau = Math.PI * 2;

function animateLeg(leg, phase) {
  const stride = Math.sin(phase);
  const liftWave = Math.max(0, Math.sin(phase + 0.45));
  const rear = leg.x < 0;

  leg.hip.rotation.z =
    stride * (rear ? 0.72 : 0.82) +
    (rear ? -0.08 : 0.04);

  leg.knee.rotation.z =
    -0.34 -
    liftWave * (rear ? 1.12 : 1.28) +
    Math.max(0, -stride) * 0.14;

  leg.hoof.rotation.z = -leg.knee.rotation.z * 0.3 - stride * 0.12;
}

function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();
  const phase = (elapsed / cycleDuration) * tau;

  const airborne = Math.pow(Math.max(0, Math.sin(phase * 2)), 2);
  bodyRig.position.y = 2.48 + airborne * 0.14;
  bodyRig.rotation.z = Math.sin(phase * 2) * 0.035;
  bodyRig.rotation.x = Math.sin(phase) * 0.018;

  chest.scale.y = 1.05 + Math.sin(phase * 2) * 0.025;
  rump.rotation.z = Math.sin(phase * 2 + 0.7) * 0.025;

  for (const leg of legs) {
    animateLeg(leg, phase + leg.phase);
  }

  neckRig.rotation.z = -0.44 + Math.sin(phase * 2 + 0.25) * 0.075;
  headRig.rotation.z = 0.48 + Math.sin(phase * 2 + 0.75) * 0.1;
  headRig.position.y = 1.43 + Math.sin(phase * 2 + 0.45) * 0.025;

  tailRig.rotation.z = 1.1 + Math.sin(phase) * 0.16;
  tailRig.rotation.x = Math.sin(phase * 2) * 0.12;
  tailSegments.forEach((segment, index) => {
    segment.rotation.z =
      Math.sin(phase - index * 0.48) * (0.18 + index * 0.035);
    segment.rotation.x =
      Math.cos(phase * 2 - index * 0.4) * (0.035 + index * 0.012);
  });

  const travel = (elapsed * 8) % 27.9;
  stripes.forEach((stripe, index) => {
    stripe.position.x = ((index * 1.55 - travel + 13.95) % 27.9) - 13.95;
  });

  camera.position.y = 4.7 + Math.sin(phase * 2) * 0.025;
  camera.lookAt(0, 2.15, 0);

  renderer.render(scene, camera);
}

animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
