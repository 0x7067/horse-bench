<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Low-Poly Horse Run Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fd4ef}
#app{position:fixed;inset:0}
canvas{display:block}
.badge{position:fixed;left:14px;top:12px;font-family:system-ui,Arial,sans-serif;font-size:13px;letter-spacing:.08em;color:#2b2118;background:rgba(255,255,255,.72);padding:8px 11px;border-radius:999px;border:1px solid rgba(0,0,0,.08);user-select:none;pointer-events:none}
.hint{position:fixed;right:14px;bottom:12px;font-family:system-ui,Arial,sans-serif;font-size:12px;color:rgba(43,33,24,.75);background:rgba(255,255,255,.6);padding:7px 10px;border-radius:10px;pointer-events:none}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}

<body>
<div id="app"></div>
<div class="badge">LOW-POLY HORSE &mdash; SEAMLESS GALLOP LOOP</div>
<div class="hint">drag to orbit &middot; scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
const container = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd4ef);
scene.fog = new THREE.Fog(0x9fd4ef, 12, 30);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
let camRadius = 6.2;
let camTheta = 0.35;
let camPhi = 1.18;
function updateCamera() {
const sP = Math.sin(camPhi);
camera.position.set(
camRadius * sP * Math.sin(camTheta),
camRadius * Math.cos(camPhi),
camRadius * sP * Math.cos(camTheta)
);
camera.lookAt(0.1, 1.15, 0);
}
updateCamera();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);
const hemi = new THREE.HemisphereLight(0xcfeaff, 0x7a9a5a, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 1.7);
sun.position.set(4, 7, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -6;
sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6;
sun.shadow.camera.bottom = -6;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xffffff, 0.45);
rim.position.set(-5, 3, -4);
scene.add(rim);
const coatMat = new THREE.MeshStandardMaterial({ color: 0x9a6132, flatShading: true, roughness: 0.9 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x3b2617, flatShading: true, roughness: 0.95 });
const muzzleMat = new THREE.MeshStandardMaterial({ color: 0x6e4226, flatShading: true, roughness: 0.9 });
const hoofMat = new THREE.MeshStandardMaterial({ color: 0x24211f, flatShading: true, roughness: 0.8 });
const creamMat = new THREE.MeshStandardMaterial({ color: 0xf2e7d5, flatShading: true, roughness: 0.9 });
function mesh(geo, mat, x = 0, y = 0, z = 0) {
const m = new THREE.Mesh(geo, mat);
m.position.set(x, y, z);
m.castShadow = true;
m.receiveShadow = true;
return m;
}
const ground = new THREE.Mesh(
new THREE.PlaneGeometry(60, 30),
new THREE.MeshStandardMaterial({ color: 0x82c46a, flatShading: true, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);
const trackMat = new THREE.MeshStandardMaterial({ color: 0xc9a06a, flatShading: true, roughness: 1 });
const track = new THREE.Mesh(new THREE.PlaneGeometry(60, 2.6), trackMat);
track.rotation.x = -Math.PI / 2;
track.position.y = 0.01;
track.receiveShadow = true;
scene.add(track);
const stripeGeo = new THREE.BoxGeometry(0.9, 0.02, 0.08);
const stripeMat = new THREE.MeshStandardMaterial({ color: 0xfff7e6, flatShading: true });
const stripes = [];
for (let i = 0; i < 22; i++) {
const s = new THREE.Mesh(stripeGeo, stripeMat);
s.position.y = 0.03;
s.receiveShadow = true;
scene.add(s);
stripes.push(s);
}
const rockMat = new THREE.MeshStandardMaterial({ color: 0x8d8d94, flatShading: true });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f8f5b, flatShading: true });
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, flatShading: true });
const scrollers = [];
function addTree(x, z, s) {
const g = new THREE.Group();
const trunk = mesh(new THREE.CylinderGeometry(0.08 * s, 0.12 * s, 0.7 * s, 5), trunkMat, 0, 0.35 * s, 0);
const top = mesh(new THREE.ConeGeometry(0.55 * s, 1.1 * s, 6), leafMat, 0, 1.15 * s, 0);
g.add(trunk, top);
g.position.set(x, 0, z);
scene.add(g);
scrollers.push({ obj: g, speed: 1 });
}
function addRock(x, z, s) {
const r = mesh(new THREE.DodecahedronGeometry(0.28 * s, 0), rockMat, x, 0.18 * s, z);
r.rotation.set(1, 2, 0.5);
scene.add(r);
scrollers.push({ obj: r, speed: 1 });
}
addTree(-6, -3.4, 1.2);
addTree(2, -4.2, 1.5);
addTree(8, -3.0, 1.0);
addRock(-2, 2.8, 1.1);
addRock(5, 3.4, 1.4);
addRock(-9, 3.0, 0.9);
addRock(11, -4.5, 1.2);
addTree(-12, 3.8, 1.3);
const horse = new THREE.Group();
scene.add(horse);
const bodyBob = new THREE.Group();
bodyBob.position.y = 1.55;
horse.add(bodyBob);
const torso = mesh(new THREE.BoxGeometry(1.7, 0.78, 0.72), coatMat, 0, 0, 0);
torso.rotation.y = 0;
bodyBob.add(torso);
const chest = mesh(new THREE.DodecahedronGeometry(0.52, 0), coatMat, 0.82, -0.02, 0);
chest.scale.set(1, 1.05, 0.85);
bodyBob.add(chest);
const rump = mesh(new THREE.DodecahedronGeometry(0.58, 0), coatMat, -0.82, 0.04, 0);
rump.scale.set(1, 1.05, 0.9);
bodyBob.add(rump);
const belly = mesh(new THREE.BoxGeometry(1.1, 0.28, 0.6), coatMat, 0, -0.42, 0);
bodyBob.add(belly);
const croup = mesh(new THREE.BoxGeometry(0.5, 0.28, 0.6), coatMat, -0.65, 0.42, 0);
croup.rotation.z = -0.25;
bodyBob.add(croup);
const withers = mesh(new THREE.BoxGeometry(0.4, 0.3, 0.5), coatMat, 0.6, 0.42, 0);
withers.rotation.z = 0.3;
bodyBob.add(withers);
const maneGeo = new THREE.BoxGeometry(0.22, 0.16, 0.1);
for (let i = 0; i < 5; i++) {
const mm = mesh(maneGeo, darkMat, 0.55 - i * 0.18, 0.62 + i * 0.11, 0);
mm.rotation.z = 0.55;
bodyBob.add(mm);
}
const neckPivot = new THREE.Group();
neckPivot.position.set(0.85, 0.28, 0);
bodyBob.add(neckPivot);
const neck = mesh(new THREE.BoxGeometry(0.72, 0.42, 0.34), coatMat, 0.28, 0.28, 0);
neck.rotation.z = 0.55;
neckPivot.add(neck);
const crest = mesh(new THREE.BoxGeometry(0.6, 0.14, 0.1), darkMat, 0.12, 0.52, 0);
crest.rotation.z = 0.55;
neckPivot.add(crest);
const headPivot = new THREE.Group();
headPivot.position.set(0.58, 0.52, 0);
neckPivot.add(headPivot);
const skull = mesh(new THREE.BoxGeometry(0.5, 0.32, 0.3), coatMat, 0.22, 0.08, 0);
skull.rotation.z = -0.15;
headPivot.add(skull);
const muzzle = mesh(new THREE.BoxGeometry(0.32, 0.26, 0.26), muzzleMat, 0.52, -0.02, 0);
headPivot.add(muzzle);
const nostrilGeo = new THREE.BoxGeometry(0.06, 0.06, 0.02);
const nL = mesh(nostrilGeo, darkMat, 0.64, -0.02, 0.1);
const nR = mesh(nostrilGeo, darkMat, 0.64, -0.02, -0.1);
headPivot.add(nL, nR);
const eyeGeo = new THREE.BoxGeometry(0.07, 0.07, 0.03);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x14100c, flatShading: true });
const eL = mesh(eyeGeo, eyeMat, 0.28, 0.14, 0.16);
const eR = mesh(eyeGeo, eyeMat, 0.28, 0.14, -0.16);
headPivot.add(eL, eR);
const earGeo = new THREE.ConeGeometry(0.08, 0.24, 4);
const earL = mesh(earGeo, coatMat, 0.02, 0.32, 0.1);
const earR = mesh(earGeo, coatMat, 0.02, 0.32, -0.1);
headPivot.add(earL, earR);
const forelock = mesh(new THREE.BoxGeometry(0.18, 0.18, 0.12), darkMat, 0.05, 0.22, 0);
forelock.rotation.z = -0.4;
headPivot.add(forelock);
const tailPivot = new THREE.Group();
tailPivot.position.set(-1.15, 0.3, 0);
bodyBob.add(tailPivot);
const tailSegGeoA = new THREE.CylinderGeometry(0.09, 0.07, 0.55, 5);
const tailSegGeoB = new THREE.CylinderGeometry(0.07, 0.04, 0.55, 5);
const tailA = mesh(tailSegGeoA, darkMat, 0, -0.24, 0);
const tailMid = new THREE.Group();
tailMid.position.set(0, -0.5, 0);
const tailB = mesh(tailSegGeoB, darkMat, 0, -0.24, 0);
const tailTuft = mesh(new THREE.ConeGeometry(0.1, 0.3, 5), darkMat, 0, -0.58, 0);
tailTuft.rotation.x = Math.PI;
tailMid.add(tailB, tailTuft);
tailPivot.add(tailA, tailMid);
function makeLeg(px, pz, isFront) {
const hip = new THREE.Group();
hip.position.set(px, -0.3, pz);
bodyBob.add(hip);
const upperLen = isFront ? 0.6 : 0.68;
const upper = mesh(new THREE.BoxGeometry(0.26, upperLen, 0.24), coatMat, 0, -upperLen / 2 + 0.05, 0);
hip.add(upper);
const muscle = mesh(new THREE.DodecahedronGeometry(0.2, 0), coatMat, 0, -0.08, 0);
muscle.scale.set(1.1, 1, 1);
hip.add(muscle);
const knee = new THREE.Group();
knee.position.set(0, -upperLen + 0.05, 0);
hip.add(knee);
const lower = mesh(new THREE.BoxGeometry(0.15, 0.55, 0.16), creamMat, 0, -0.24, 0);
knee.add(lower);
const fetlock = mesh(new THREE.BoxGeometry(0.14, 0.14, 0.15), darkMat, 0, -0.52, 0);
knee.add(fetlock);
const hoof = mesh(new THREE.BoxGeometry(0.26, 0.14, 0.22), hoofMat, 0.03, -0.63, 0);
knee.add(hoof);
return { hip, knee };
}
const legFL = makeLeg(0.68, 0.24, true);
const legFR = makeLeg(0.68, -0.24, true);
const legBL = makeLeg(-0.72, 0.26, false);
const legBR = makeLeg(-0.72, -0.26, false);
const dustGeo = new THREE.DodecahedronGeometry(0.12, 0);
const dustMat = new THREE.MeshStandardMaterial({ color: 0xe8d3ae, transparent: true, opacity: 0.8, flatShading: true });
const dusts = [];
for (let i = 0; i < 10; i++) {
const d = new THREE.Mesh(dustGeo, dustMat.clone());
d.castShadow = false;
scene.add(d);
dusts.push(d);
}
const clock = new THREE.Clock();
const STRIDE = 0.85;
const TAU = Math.PI * 2;
function animateLeg(leg, phase) {
const swing = Math.sin(phase);
leg.hip.rotation.z = swing * 0.85;
const fold = 0.5 + 0.5 * Math.sin(phase - 1.1);
leg.knee.rotation.z = -0.25 - fold * 1.25;
}
let dragging = false;
let px = 0;
let py = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
if (!dragging) return;
camTheta -= (e.clientX - px) * 0.006;
camPhi -= (e.clientY - py) * 0.004;
camPhi = Math.max(0.25, Math.min(1.45, camPhi));
px = e.clientX; py = e.clientY;
updateCamera();
});
addEventListener('wheel', (e) => {
camRadius = Math.max(3.5, Math.min(11, camRadius + e.deltaY * 0.004));
updateCamera();
}, { passive: true });
addEventListener('resize', () => {
camera.aspect = innerWidth / innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth, innerHeight);
});
function tick() {
requestAnimationFrame(tick);
const t = clock.getElapsedTime();
const phase = ((t % STRIDE) / STRIDE) * TAU;
const bob = Math.sin(phase * 2);
const bob2 = Math.sin(phase * 2 + 1.2);
bodyBob.position.y = 1.55 + bob * 0.09;
bodyBob.rotation.z = bob2 * 0.045;
bodyBob.position.x = Math.sin(phase) * 0.03;
neckPivot.rotation.z = Math.sin(phase * 2 - 0.7) * 0.12 - 0.04;
headPivot.rotation.z = Math.sin(phase * 2 - 1.4) * 0.16 - 0.1;
headPivot.position.y = 0.52 + Math.sin(phase * 2 - 0.5) * 0.03;
earL.rotation.x = Math.sin(phase * 2) * 0.15;
earR.rotation.x = -Math.sin(phase * 2) * 0.15;
tailPivot.rotation.z = 0.7 + Math.sin(phase - 0.4) * 0.35;
tailPivot.rotation.x = Math.sin(phase * 2) * 0.2;
tailMid.rotation.z = -0.25 + Math.sin(phase - 1.0) * 0.5;
animateLeg(legBL, phase);
animateLeg(legBR, phase + 0.35);
animateLeg(legFL, phase + Math.PI);
animateLeg(legFR, phase + Math.PI + 0.35);
const worldSpeed = 9;
for (let i = 0; i < stripes.length; i++) {
const span = 36;
let x = ((i / stripes.length) * span - t * worldSpeed) % span;
if (x < -18) x += span;
stripes[i].position.set(x - 4, 0.03, (i % 2 === 0 ? 0.85 : -0.85) + Math.sin(i * 7.3) * 0.2);
}
for (const s of scrollers) {
s.obj.position.x -= worldSpeed * 0.016 * 0.62;
if (s.obj.position.x < -18) s.obj.position.x += 36;
}
for (let i = 0; i < dusts.length; i++) {
const life = ((phase / TAU) + i / dusts.length) % 1;
const d = dusts[i];
d.position.set(-1.6 - life * 1.8, 0.15 + life * 0.55, ((i % 2) ? 0.3 : -0.3) + Math.sin(i * 5 + t * 2) * 0.12);
const sc = 0.4 + life * 1.4;
d.scale.set(sc, sc, sc);
d.material.opacity = 0.55 * (1 - life);
d.rotation.set(i * 2 + t, i + t * 0.7, 0);
}
renderer.render(scene, camera);
}
tick();
</script>

-spark-1.3-contributor \u00b7 default\">pi \u00b7 opencode-go/muse-spark-1.3-contributor \u00b7 default\u003c/div>\u003cdiv class=\"count\">14 / 19\u003c/div>\u003c/div>\u003c/nav>";document.body.append(host)})();</script></body>
