<script type="importmap">
{

    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"

<script type="module">
import * as THREE from 'three';

/* ---------------------------------------------------------------- constants */
const TAU = Math.PI * 2;
const STRIDE = 0.62;            // seconds per stride = loop period
const TILES_PER_STRIDE = 3;     // ground repeats advanced per stride (integer => seamless)
const TILE = 2;                 // world units per ground tile
const PIVOT_Y = 1.15;           // body pitch/bob origin

/* ---------------------------------------------------------------- helpers */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

function bump(q, a, b) {
  const s = (q - a) / (b - a);
  if (s <= 0 || s >= 1) return 0;
  const v = Math.sin(Math.PI * s);
  return v * v;
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------------------------------------------------------- renderer */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const HAZE = new THREE.Color('#e6d5b8');
scene.fog = new THREE.Fog(HAZE, 17, 64);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 400);

/* -------------------------------------------------------------------- sky */
(function buildSky() {
  const cv = document.createElement('canvas');
  cv.width = 4; cv.height = 256;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.00, '#2f6fb2');
  grad.addColorStop(0.42, '#8eb8dd');
  grad.addColorStop(0.72, '#cfe0e6');
  grad.addColorStop(0.88, '#e6d5b8');
  grad.addColorStop(1.00, '#e6d5b8');
  g.fillStyle = grad;
  g.fillRect(0, 0, 4, 256);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();

/* ----------------------------------------------------------------- lights */
scene.add(new THREE.HemisphereLight(0xbdd7f3, 0x8d7048, 1.0));

const sun = new THREE.DirectionalLight(0xffe7c2, 2.4);
sun.position.set(5.5, 8.5, 3.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5;
sun.shadow.camera.right = 5;
sun.shadow.camera.top = 5;
sun.shadow.camera.bottom = -5;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 32;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.028;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 1.0, 0);

const rim = new THREE.DirectionalLight(0xbcd2ff, 0.55);
rim.position.set(-6, 4, -6.5);
scene.add(rim);

/* ----------------------------------------------------------------- ground */
function groundTexture() {
  const S = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const rnd = mulberry32(20240611);

  g.fillStyle = '#c1a273';
  g.fillRect(0, 0, S, S);

  for (let i = 0; i < 150; i++) {
    const x = rnd() * S;
    const y = rnd() * S;
    const r = 14 + rnd() * 54;
    const ry = r * (0.55 + rnd() * 0.7);
    const rot = rnd() * Math.PI;
    const a = 0.045 + rnd() * 0.075;
    const light = rnd() < 0.5;
    g.fillStyle = light ? `rgba(226,205,160,${a})` : `rgba(97,74,44,${a})`;
    for (let ox = -1; ox <= 1; ox++) {
      for (let oy = -1; oy <= 1; oy++) {
        g.beginPath();
        g.ellipse(x + ox * S, y + oy * S, r, ry, rot, 0, TAU);
        g.fill();
      }
    }
  }

  for (let i = 0; i < 1400; i++) {
    const x = rnd() * S;
    const y = rnd() * S;
    const r = 0.8 + rnd() * 2.2;
    const a = 0.05 + rnd() * 0.12;
    g.fillStyle = rnd() < 0.5 ? `rgba(80,60,36,${a})` : `rgba(240,224,186,${a})`;
    for (let ox = -1; ox <= 1; ox++) {
      for (let oy = -1; oy <= 1; oy++) {
        g.beginPath();
        g.arc(x + ox * S, y + oy * S, r, 0, TAU);
        g.fill();
      }
    }
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.repeat.set(200 / TILE, 200 / TILE);
  return tex;
}

const groundTex = groundTexture();
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* -------------------------------------------------------------- materials */
const coatMat = new THREE.MeshStandardMaterial({ color: 0xa9633a, flatShading: true, roughness: 0.95, metalness: 0.0 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x33231a, flatShading: true, roughness: 0.90, metalness: 0.0 });
const hoofMat = new THREE.MeshStandardMaterial({ color: 0x241b16, flatShading: true, roughness: 0.50, metalness: 0.15 });
const eyeMat  = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, flatShading: true, roughness: 0.25, metalness: 0.40 });
const noseMat = new THREE.MeshStandardMaterial({ color: 0x4a3026, flatShading: true, roughness: 0.85 });

/* ------------------------------------------------------- geometry helpers */
function taperBox(w, h, d, topX = 1, topZ = 1, botX = 1, botZ = 1) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const t = p.getY(i) / h + 0.5;
    const sx = botX + (topX - botX) * t;
    const sz = botZ + (topZ - botZ) * t;
    p.setX(i, p.getX(i) * sx);
    p.setZ(i, p.getZ(i) * sz);
  }
  geo.computeVertexNormals();
  return geo;
}

function add(parent, geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* torso: lofted rings of superellipse cross-sections, built along +z */
function loftBody(sections, sides) {
  const rings = sections.map(([z, w, h, cy]) => {
    const ring = [];
    for (let i = 0; i < sides; i++) {
      const a = (i / sides) * TAU;
      const c = Math.cos(a);
      const s = Math.sin(a);
      const e = 0.62;
      ring.push([
        Math.sign(c) * Math.pow(Math.abs(c), e) * w,
        cy + Math.sign(s) * Math.pow(Math.abs(s), e) * h,
        z
      ]);
    }
    return ring;
  });

  const pos = [];
  for (const ring of rings) for (const v of ring) pos.push(v[0], v[1], v[2]);

  const idx = [];
  const n = sides;
  for (let r = 0; r < rings.length - 1; r++) {
    for (let i = 0; i < n; i++) {
      const a = r * n + i;
      const b = r * n + ((i + 1) % n);
      const c = (r + 1) * n + i;
      const d = (r + 1) * n + ((i + 1) % n);
      idx.push(a, c, b, b, c, d);
    }
  }

  const frontCenter = pos.length / 3;
  pos.push(0, sections[0][3], sections[0][0]);
  const lastSection = sections[sections.length - 1];
  const backCenter = pos.length / 3;
  pos.push(0, lastSection[3], lastSection[0]);
  const backBase = (rings.length - 1) * n;
  for (let i = 0; i < n; i++) {
    idx.push(frontCenter, i, (i + 1) % n);
    idx.push(backCenter, backBase + ((i + 1) % n), backBase + i);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

/* ------------------------------------------------------------ horse rig */
const horse = new THREE.Group();
scene.add(horse);

const pivot = new THREE.Group();       // pitches + bobs about the body centre
pivot.position.y = PIVOT_Y;
horse.add(pivot);

const rig = new THREE.Group();         // holds parts in ground-relative coords
rig.position.y = -PIVOT_Y;
pivot.add(rig);

/* torso */
const torso = new THREE.Mesh(loftBody([
  [ 1.02, 0.260, 0.300, 1.24],
  [ 0.84, 0.330, 0.370, 1.19],
  [ 0.54, 0.360, 0.410, 1.15],
  [ 0.16, 0.375, 0.430, 1.12],
  [-0.22, 0.355, 0.420, 1.13],
  [-0.58, 0.375, 0.440, 1.16],
  [-0.86, 0.340, 0.430, 1.19],
  [-1.02, 0.220, 0.310, 1.18]
], 8), coatMat);
torso.castShadow = true;
torso.receiveShadow = true;
rig.add(torso);

/* withers / shoulder mass hides the neck joint */
const withers = add(rig, new THREE.IcosahedronGeometry(1, 0), coatMat, 0, 1.34, 0.72);
withers.scale.set(0.29, 0.25, 0.34);

/* neck: local +y runs from shoulder toward poll */
const neck = new THREE.Group();
neck.position.set(0, 1.30, 0.80);
neck.rotation.x = 0.95;
rig.add(neck);
add(neck, taperBox(0.34, 0.66, 0.38, 0.70, 0.80, 1.06, 1.00), coatMat, 0, 0.33, 0);

/* mane running along the crest of the neck */
for (let i = 0; i < 6; i++) {
  const t = i / 5;
  const piece = add(
    neck,
    taperBox(0.075, 0.165, 0.30 - 0.09 * t, 0.60, 0.85, 1.0, 1.0),
    darkMat,
    0,
    0.08 + t * 0.55,
    -0.17 - 0.015 * t
  );
  piece.rotation.x = -0.34 + 0.10 * t;
  piece.rotation.z = Math.sin(i * 2.1) * 0.07;
}

/* head: local +y runs from poll toward muzzle */
const head = new THREE.Group();
head.position.y = 0.66;
head.rotation.x = 0.72;
neck.add(head);

add(head, taperBox(0.29, 0.34, 0.31, 0.86, 0.90, 1.12, 1.05), coatMat, 0, 0.17, 0);
add(head, taperBox(0.19, 0.30, 0.21, 0.80, 0.86, 1.00, 1.00), coatMat, 0, 0.49, 0.010);
add(head, new THREE.BoxGeometry(0.15, 0.07, 0.16), noseMat, 0, 0.615, 0.030);

for (const sx of [-1, 1]) {
  add(head, new THREE.IcosahedronGeometry(0.045, 0), eyeMat, 0.145 * sx, 0.215, -0.045);
  const ear = add(head, new THREE.ConeGeometry(0.055, 0.17, 4), coatMat, 0.085 * sx, 0.295, -0.115);
  ear.rotation.set(-1.28, 0, -0.22 * sx);
}

/* tail: chained segments streaming back */
const tailRoot = new THREE.Group();
tailRoot.position.set(0, 1.42, -0.97);
tailRoot.rotation.x = -1.65;
rig.add(tailRoot);

const TAIL_LEN = 0.30;
const TAIL_W = [0.17, 0.15, 0.12, 0.085];
const tailSegs = [];
let tailParent = tailRoot;
for (let i = 0; i < 4; i++) {
  const seg = new THREE.Group();
  seg.position.y = i === 0 ? 0 : TAIL_LEN;
  seg.rotation.x = -0.06;
  tailParent.add(seg);
  add(seg, taperBox(TAIL_W[i], TAIL_LEN, TAIL_W[i] * 1.05, 0.85, 0.85, 1.0, 1.0), darkMat, 0, TAIL_LEN / 2, 0);
  tailSegs.push(seg);
  tailParent = seg;
}

/* --------------------------------------------------------------- the legs */
function limb(len, w, d, mat, botX, botZ) {
  const m = new THREE.Mesh(taperBox(w, len, d, 1, 1, botX, botZ), mat);
  m.position.y = -len / 2;
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function hoof(parent) {
  const h = new THREE.Mesh(new THREE.BoxGeometry(0.155, 0.10, 0.215), hoofMat);
  h.position.set(0, -0.05, 0.012);
  h.castShadow = true;
  h.receiveShadow = true;
  parent.add(h);
}

function foreleg(side) {
  const shoulder = new THREE.Group();
  shoulder.position.set(0.235 * side, 1.00, 0.56);
  rig.add(shoulder);
  shoulder.add(limb(0.46, 0.190, 0.250, coatMat, 0.72, 0.70));

  const knee = new THREE.Group();
  knee.position.y = -0.46;
  shoulder.add(knee);
  knee.add(limb(0.42, 0.135, 0.165, darkMat, 0.78, 0.80));

  const fetlock = new THREE.Group();
  fetlock.position.y = -0.42;
  knee.add(fetlock);
  hoof(fetlock);

  return [shoulder, knee, fetlock];
}

function hindleg(side) {
  const hip = new THREE.Group();
  hip.position.set(0.25 * side, 1.06, -0.62);
  rig.add(hip);
  hip.add(limb(0.34, 0.260, 0.400, coatMat, 0.62, 0.58));

  const stifle = new THREE.Group();
  stifle.position.y = -0.34;
  hip.add(stifle);
  stifle.add(limb(0.33, 0.200, 0.290, coatMat, 0.72, 0.72));

  const hock = new THREE.Group();
  hock.position.y = -0.33;
  stifle.add(hock);
  hock.add(limb(0.33, 0.145, 0.170, darkMat, 0.78, 0.82));

  const fetlock = new THREE.Group();
  fetlock.position.y = -0.33;
  hock.add(fetlock);
  hoof(fetlock);

  return [hip, stifle, hock, fetlock];
}

const foreL = foreleg(-1);
const foreR = foreleg(1);
const hindL = hindleg(-1);
const hindR = hindleg(1);

/* ---------------------------------------------------------- leg animation */
function poseFore(J, q) {
  const swing = -1.00 * Math.cos(TAU * q);   // negative = forward reach
  const fold  = bump(q, 0.40, 0.96);         // carpus folds through the air
  const land  = bump(q, 0.16, 0.40);         // slight extension before impact
  J[0].rotation.x = swing;
  J[1].rotation.x = 1.30 * fold - 0.12 * land;
  J[2].rotation.x = -0.40 * fold + 0.20 * land;
}

function poseHind(J, q) {
  const swing = -0.92 * Math.cos(TAU * q);
  const fold  = bump(q, 0.42, 0.99);         // hock tucks the hoof up behind
  J[0].rotation.x = -0.34 + swing - 0.30 * fold;
  J[1].rotation.x =  0.94 + 1.05 * fold;
  J[2].rotation.x = -0.55 - 0.95 * fold;
  J[3].rotation.x = -0.35 * fold;
}

/* ---------------------------------------------------------------- camera */
let camAz = 0.62;
let camEl = 0.24;
let camDist = 7.6;
const camTarget = new THREE.Vector3(0, 1.05, 0);

function updateCamera() {
  const ce = Math.cos(camEl);
  camera.position.set(
    camTarget.x + camDist * ce * Math.sin(camAz),
    camTarget.y + camDist * Math.sin(camEl),
    camTarget.z + camDist * ce * Math.cos(camAz)
  );
  camera.lookAt(camTarget);
}

const dom = renderer.domElement;
let dragging = false;
let lastX = 0;
let lastY = 0;

dom.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  try { dom.setPointerCapture(e.pointerId); } catch (_) {}
});
dom.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camAz -= (e.clientX - lastX) * 0.006;
  camEl = clamp(camEl + (e.clientY - lastY) * 0.005, 0.03, 1.30);
  lastX = e.clientX;
  lastY = e.clientY;
});
const endDrag = (e) => {
  dragging = false;
  try { dom.releasePointerCapture(e.pointerId); } catch (_) {}
};
dom.addEventListener('pointerup', endDrag);
dom.addEventListener('pointercancel', endDrag);
dom.addEventListener('wheel', (e) => {
  e.preventDefault();
  camDist = clamp(camDist * (1 + Math.sign(e.deltaY) * 0.09), 3.2, 22);
}, { passive: false });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ------------------------------------------------------------------- loop */
const clock = new THREE.Clock();
let elapsed = 0;
let groundShift = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  const q = (elapsed / STRIDE) % 1;

  poseFore(foreL, (q + 0.50) % 1);
  poseFore(foreR, (q + 0.62) % 1);
  poseHind(hindL, q);
  poseHind(hindR, (q + 0.12) % 1);

  pivot.position.y = PIVOT_Y + 0.052 * Math.cos(TAU * 2 * (q - 0.06));
  pivot.rotation.x = 0.050 * Math.sin(TAU * 2 * (q - 0.06) + 0.9);
  pivot.rotation.z = 0.018 * Math.sin(TAU * q);

  neck.rotation.x = 0.95 + 0.09 * Math.sin(TAU * q + 0.4);
  head.rotation.x = 0.72 + 0.11 * Math.sin(TAU * q + 1.0);

  for (let i = 0; i < tailSegs.length; i++) {
    const seg = tailSegs[i];
    const f = i + 1;
    seg.rotation.x = -0.06 + 0.05 * f * Math.sin(TAU * q - i * 0.55);
    seg.rotation.z = 0.035 * f * Math.sin(TAU * q - i * 0.75 + 0.6);
  }

  groundShift -= (dt / STRIDE) * TILES_PER_STRIDE;
  while (groundShift < -TILES_PER_STRIDE) groundShift += TILES_PER_STRIDE;
  groundTex.offset.y = groundShift;

  updateCamera();
  renderer.render(scene, camera);
}

updateCamera();
animate();
</script>
