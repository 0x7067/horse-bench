<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Low-Poly Gallop</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfe9f2}
canvas{display:block}
#hud{position:fixed;left:14px;bottom:12px;font:12px/1.5 system-ui,sans-serif;color:#3a5638;opacity:.8;pointer-events:none;user-select:none}
</style>
</head>
<body>
<div id="hud">low-poly gallop &middot; drag to orbit &middot; scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe9f2);
scene.fog = new THREE.Fog(0xcfe9f2, 16, 42);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 120);
camera.position.set(5.0, 2.3, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.3, 1.0, 0);
controls.enableDamping = true;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.52;

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x7a9a58, 0.95));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.7);
sun.position.set(5, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -9;
sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9;
sun.shadow.camera.bottom = -9;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 25;
scene.add(sun);

const rand = (a, b) => a + Math.random() * (b - a);
const mat = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.85 });

const coatM  = mat(0x9d6a3c);
const darkM  = mat(0x6e4526);
const maneM  = mat(0x452b16);
const hoofM  = mat(0x2e2823);
const eyeM   = mat(0x171310);
const barkM  = mat(0x6b4a2e);
const leafM  = mat(0x5d9245);
const leafDM = mat(0x4a7a38);
const rockM  = mat(0x9aa0a3);
const cloudM = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 1 });

function part(geo, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  return m;
}

/* ---------------- environment ---------------- */

const ground = new THREE.Mesh(new THREE.CircleGeometry(45, 64), mat(0x7fae5c));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const path = new THREE.Mesh(new THREE.PlaneGeometry(44, 2.4), mat(0x93bd6a));
path.rotation.x = -Math.PI / 2;
path.position.y = 0.005;
path.receiveShadow = true;
scene.add(path);

const scrollList = [];
const scrollers = new THREE.Group();
scene.add(scrollers);

function scatter(obj, zmin, zmax, spd) {
  const side = Math.random() < 0.5 ? -1 : 1;
  obj.position.set(rand(-19, 19), obj.position.y, side * rand(zmin, zmax));
  obj.userData = { spd, zmin, zmax };
  scrollers.add(obj);
  scrollList.push(obj);
}

const tuftMats = [mat(0x6f9f4a), mat(0x87b45e), mat(0x5d9245)];
function makeTuft() {
  return part(new THREE.ConeGeometry(rand(0.05, 0.09), rand(0.16, 0.3), 4), tuftMats[Math.floor(rand(0, 3))], 0, 0.09, 0);
}
function makeRock() {
  const r = rand(0.14, 0.3);
  const m = part(new THREE.IcosahedronGeometry(r, 0), rockM, 0, r * 0.5, 0);
  m.scale.y = rand(0.5, 0.75);
  m.rotation.y = rand(0, Math.PI);
  return m;
}
function makeBush() {
  const g = new THREE.Group();
  const b = part(new THREE.IcosahedronGeometry(rand(0.3, 0.45), 0), leafM, 0, 0.3, 0);
  b.scale.y = 0.7;
  g.add(b);
  return g;
}
function makeTree() {
  const g = new THREE.Group();
  g.add(part(new THREE.CylinderGeometry(0.09, 0.15, 0.75, 5), barkM, 0, 0.37, 0));
  g.add(part(new THREE.ConeGeometry(0.65, 1.4, 6), leafM, 0, 1.3, 0));
  g.add(part(new THREE.ConeGeometry(0.45, 1.0, 6), leafDM, 0, 2.0, 0));
  g.scale.setScalar(rand(0.8, 1.5));
  g.rotation.y = rand(0, Math.PI);
  return g;
}

for (let i = 0; i < 48; i++) scatter(makeTuft(), 0.9, 9, 5.6);
for (let i = 0; i < 10; i++) scatter(makeRock(), 1.6, 10, 5.6);
for (let i = 0; i < 9; i++)  scatter(makeBush(), 2.2, 11, 5.6);
for (let i = 0; i < 9; i++)  scatter(makeTree(), 4.5, 14, 5.6);

const cloudList = [];
function makeCloud() {
  const g = new THREE.Group();
  [[0, 0, 0, 1], [0.9, -0.06, 0.2, 0.7], [-0.9, -0.03, -0.1, 0.8]].forEach(([px, py, pz, ps]) => {
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(0.6 * ps, 0), cloudM);
    b.position.set(px, py, pz);
    b.scale.y = 0.6;
    g.add(b);
  });
  g.position.set(rand(-24, 24), rand(5.5, 8.5), rand(-16, -5));
  g.scale.setScalar(rand(0.9, 1.6));
  scene.add(g);
  cloudList.push(g);
}
for (let i = 0; i < 4; i++) makeCloud();

/* ---------------- horse ---------------- */

const BODY_Y = 1.08;
const horse = new THREE.Group();
const body = new THREE.Group();
body.position.y = BODY_Y;
horse.add(body);
scene.add(horse);

const barrel = part(new THREE.CylinderGeometry(0.42, 0.47, 1.5, 7), coatM, -0.02, 0, 0);
barrel.rotation.z = Math.PI / 2;
body.add(barrel);

const chest = part(new THREE.IcosahedronGeometry(0.5, 0), coatM, 0.52, 0.03, 0);
chest.scale.set(1, 1.05, 0.88);
const rump = part(new THREE.IcosahedronGeometry(0.52, 0), coatM, -0.6, 0.07, 0);
rump.scale.set(0.9, 1.0, 0.85);
body.add(chest, rump);

/* neck, mane, head */
const neckPivot = new THREE.Group();
neckPivot.position.set(0.66, 0.38, 0);
body.add(neckPivot);

const neck = part(new THREE.CylinderGeometry(0.13, 0.28, 0.95, 5), coatM);
neck.geometry.translate(0, 0.475, 0);
neckPivot.add(neck);

const mane = part(new THREE.BoxGeometry(0.13, 0.98, 0.17), maneM, -0.2, 0.45, 0);
mane.rotation.z = -0.05;
neckPivot.add(mane);

const headPivot = new THREE.Group();
headPivot.position.set(0, 0.92, 0);
neckPivot.add(headPivot);

headPivot.add(part(new THREE.BoxGeometry(0.3, 0.28, 0.24), coatM, 0.04, 0.04, 0));
headPivot.add(part(new THREE.BoxGeometry(0.26, 0.2, 0.2), coatM, 0.3, -0.02, 0));
headPivot.add(part(new THREE.BoxGeometry(0.08, 0.14, 0.16), darkM, 0.45, -0.04, 0));
headPivot.add(part(new THREE.IcosahedronGeometry(0.035, 0), eyeM, 0.1, 0.1, 0.115));
headPivot.add(part(new THREE.IcosahedronGeometry(0.035, 0), eyeM, 0.1, 0.1, -0.115));

const forelock = part(new THREE.BoxGeometry(0.1, 0.12, 0.16), maneM, -0.06, 0.18, 0);
forelock.rotation.z = 0.3;
headPivot.add(forelock);

function makeEar(side) {
  const e = part(new THREE.ConeGeometry(0.05, 0.18, 4), coatM, -0.06, 0.2, 0.08 * side);
  e.geometry.translate(0, 0.09, 0);
  e.rotation.z = 0.55;
  e.rotation.x = 0.22 * side;
  return e;
}
headPivot.add(makeEar(1), makeEar(-1));

/* tail */
const tailPivot = new THREE.Group();
tailPivot.position.set(-1.02, 0.3, 0);
body.add(tailPivot);
const tail1 = part(new THREE.CylinderGeometry(0.045, 0.1, 0.5, 5), maneM, 0, 0.25, 0);
const tailMid = new THREE.Group();
tailMid.position.y = 0.5;
tailMid.add(part(new THREE.CylinderGeometry(0.012, 0.05, 0.45, 5), maneM, 0, 0.22, 0));
tailPivot.add(tail1, tailMid);

/* legs */
function makeLeg(isFront) {
  const hip = new THREE.Group();
  const upper = part(new THREE.CylinderGeometry(isFront ? 0.1 : 0.13, isFront ? 0.065 : 0.075, 0.5, 5), coatM);
  upper.geometry.translate(0, -0.25, 0);
  hip.add(upper);
  const knee = new THREE.Group();
  knee.position.y = -0.5;
  const lower = part(new THREE.CylinderGeometry(0.055, 0.045, 0.42, 5), darkM);
  lower.geometry.translate(0, -0.21, 0);
  const hoof = part(new THREE.BoxGeometry(0.14, 0.09, 0.15), hoofM, 0.02, -0.44, 0);
  knee.add(lower, hoof);
  hip.add(knee);
  return { hip, knee };
}

const legFL = makeLeg(true);  legFL.hip.position.set(0.55, -0.15, 0.25);
const legFR = makeLeg(true);  legFR.hip.position.set(0.55, -0.15, -0.25);
const legBL = makeLeg(false); legBL.hip.position.set(-0.58, -0.13, 0.27);
const legBR = makeLeg(false); legBR.hip.position.set(-0.58, -0.13, -0.27);
body.add(legFL.hip, legFR.hip, legBL.hip, legBR.hip);

const legs = [
  { l: legBL, phase: 0.25, front: false },
  { l: legBR, phase: 0.14, front: false },
  { l: legFL, phase: 0.05, front: true },
  { l: legFR, phase: -0.04, front: true }
];

/* ---------------- animation ---------------- */

const CYCLE = 9;
const clock = new THREE.Clock();
const NECK_BASE = -0.78;
const HEAD_BASE = 0.66;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const w = clock.elapsedTime * CYCLE;

  for (const d of legs) {
    const th = w + d.phase * Math.PI * 2;
    const swing = d.front ? 0.55 : 0.62;
    const bend = d.front ? 1.0 : 0.8;
    const lift = Math.pow(Math.max(0, Math.cos(th)), d.front ? 1.4 : 1.2);
    d.l.hip.rotation.z = swing * Math.sin(th) + (d.front ? 0.02 : -0.06);
    d.l.knee.rotation.z = (d.front ? -1 : 1) * bend * lift + (d.front ? -0.08 : 0.2);
  }

  body.position.y = BODY_Y + 0.08 * Math.sin(w - 2.65);
  body.rotation.z = -0.07 * Math.sin(w - 0.5);
  body.rotation.x = 0.015 * Math.sin(w * 2);

  neckPivot.rotation.z = NECK_BASE - 0.12 * Math.sin(w - 0.1);
  headPivot.rotation.z = HEAD_BASE + 0.08 * Math.sin(w + 0.9);
  mane.rotation.x = 0.04 * Math.sin(w * 2);

  tailPivot.rotation.z = 0.95 + 0.18 * Math.sin(w - 2.1);
  tailPivot.rotation.x = 0.05 * Math.sin(w + 1.5);
  tailMid.rotation.z = 0.3 * Math.sin(w - 2.9);

  for (const o of scrollList) {
    o.position.x -= o.userData.spd * dt;
    if (o.position.x < -19) {
      o.position.x += 38;
      o.position.z = (Math.random() < 0.5 ? -1 : 1) * rand(o.userData.zmin, o.userData.zmax);
    }
  }
  for (const c of cloudList) {
    c.position.x -= 0.9 * dt;
    if (c.position.x < -24) c.position.x += 48;
  }

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
