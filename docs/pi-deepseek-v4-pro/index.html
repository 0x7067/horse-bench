<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">

<title>Low-poly running horse</title>
<style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const L = 12;
const P = 0.75;
const W = 2 * Math.PI / P;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ecae6);
scene.fog = new THREE.Fog(0x8ecae6, 18, 46);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x3c5a3a, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(6, 9, 4);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xfff2df, 0.5);
fill.position.set(-5, 2, -3);
scene.add(fill);

const mats = {};
function mat(color) {
  if (!mats[color]) mats[color] = new THREE.MeshLambertMaterial({ color, flatShading: true });
  return mats[color];
}
function box(w, h, d, color) {
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), mat(0x7fb453));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(1.25, 28),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 })
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = 0.015;
scene.add(shadow);

const horse = new THREE.Group();
scene.add(horse);

const BODY = 0x9a6840;
const DARK = 0x3c2a1c;
const LEGC = 0x8a5a38;

const body = box(1.95, 0.72, 0.62, BODY);
body.position.set(0, 1.2, 0);
horse.add(body);

const chest = box(0.5, 0.98, 0.62, BODY);
chest.position.set(0.96, 1.04, 0);
chest.rotation.z = -0.5;
horse.add(chest);

const hind = box(0.62, 0.98, 0.64, BODY);
hind.position.set(-0.99, 1.06, 0);
hind.rotation.z = 0.45;
horse.add(hind);

const neck = new THREE.Group();
neck.position.set(0.7, 1.44, 0);
neck.rotation.z = -0.55;
horse.add(neck);
const neckMesh = box(0.42, 0.78, 0.42, BODY);
neckMesh.position.set(0, 0.36, 0);
neck.add(neckMesh);
for (const y of [0.28, 0.46, 0.62]) {
  const m = box(0.1, 0.3, 0.16, DARK);
  m.position.set(0, y, 0);
  neck.add(m);
}

const head = new THREE.Group();
head.position.set(0.06, 0.76, 0);
neck.add(head);
const headMesh = box(0.86, 0.32, 0.42, BODY);
headMesh.position.set(0.23, 0, 0);
head.add(headMesh);
const snout = box(0.34, 0.26, 0.34, BODY);
snout.position.set(0.76, -0.04, 0);
head.add(snout);
for (const z of [-0.14, 0.14]) {
  const ear = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.18, 4), mat(DARK));
  ear.position.set(0.12, 0.28, z);
  ear.rotation.z = -0.25;
  head.add(ear);
  const eye = box(0.07, 0.07, 0.04, 0x151515);
  eye.position.set(0.4, 0.09, z > 0 ? 0.22 : -0.22);
  head.add(eye);
}

const tail = new THREE.Group();
tail.position.set(-1.2, 1.26, 0);
tail.rotation.z = -0.42;
horse.add(tail);
const tailSegs = [
  [0.16, 0.36, 0.12, 0, -0.17],
  [0.13, 0.36, 0.1, 0.03, -0.52],
  [0.11, 0.4, 0.08, 0.04, -0.88]
];
for (const [w, h, d, x, y] of tailSegs) {
  const m = box(w, h, d, DARK);
  m.position.set(x, y, 0);
  tail.add(m);
}

function makeLeg(x, z, base, amp, flexAmp, flexBase, flexSign, phase) {
  const leg = new THREE.Group();
  leg.position.set(x, 1.05, z);
  horse.add(leg);
  const upper = new THREE.Group();
  leg.add(upper);
  const um = box(0.2, 0.46, 0.22, LEGC);
  um.position.y = -0.23;
  upper.add(um);
  const knee = new THREE.Group();
  knee.position.y = -0.46;
  upper.add(knee);
  const lm = box(0.17, 0.44, 0.19, LEGC);
  lm.position.y = -0.22;
  knee.add(lm);
  const hf = box(0.16, 0.11, 0.2, DARK);
  hf.position.y = -0.49;
  knee.add(hf);
  return { upper, knee, base, amp, flexAmp, flexBase, flexSign, phase };
}

const legs = [
  makeLeg(0.78, -0.27, 0.28, 0.5, 0.85, -0.18, -1, 0),
  makeLeg(0.78, 0.27, 0.28, 0.5, 0.85, -0.18, -1, Math.PI * 0.7),
  makeLeg(-0.78, -0.27, -0.3, 0.42, 0.75, 0.12, 1, Math.PI * 1.15),
  makeLeg(-0.78, 0.27, -0.3, 0.42, 0.75, 0.12, 1, Math.PI * 1.85)
];

function makeTree() {
  const g = new THREE.Group();
  const trunk = box(0.22, 1.1, 0.22, 0x7a5230);
  trunk.position.y = 0.55;
  g.add(trunk);
  const crown = new THREE.Mesh(
    new THREE.ConeGeometry(0.75, 1.6, 5),
    mat(Math.random() < 0.5 ? 0x4f8f3f : 0x62a044)
  );
  crown.position.y = 1.7;
  g.add(crown);
  return g;
}
function makeRock() {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 0), mat(0x9d9d9d));
  m.scale.y = 0.6;
  m.rotation.set(Math.random() * 3, Math.random() * 3, 0);
  m.position.y = 0.18;
  return m;
}

const scatter = new THREE.Group();
scene.add(scatter);

const items = [];
const SPAN = 30;
const SPEED = SPAN / L;
for (let i = 0; i < 18; i++) {
  const m = Math.random() < 0.62 ? makeTree() : makeRock();
  const baseX = (Math.random() - 0.5) * SPAN;
  m.position.x = baseX;
  m.position.z = (Math.random() < 0.5 ? -1 : 1) * (3.4 + Math.random() * 7.5);
  scatter.add(m);
  items.push({ m, baseX });
}

const clouds = new THREE.Group();
scene.add(clouds);
const CLOUD_SPAN = 24;
const CLOUD_SPEED = CLOUD_SPAN / L;
for (let i = 0; i < 4; i++) {
  const c = new THREE.Group();
  const parts = [
    [0, 0, 1.1, 0.26, 0.5],
    [0.55, 0.12, 0.7, 0.22, 0.42],
    [-0.5, 0.1, 0.65, 0.2, 0.4],
    [0.05, 0.2, 0.5, 0.2, 0.36]
  ];
  for (const [x, y, w, h, d] of parts) {
    const b = box(w, h, d, 0xffffff);
    b.position.set(x, y, 0);
    c.add(b);
  }
  c.position.set((Math.random() - 0.5) * CLOUD_SPAN, 6.5 + Math.random() * 3, -6 - Math.random() * 6);
  clouds.add(c);
}
const cloudItems = [];
clouds.children.forEach((c) => cloudItems.push({ m: c, baseX: c.position.x }));

function wrap(v, span) {
  return ((v % span) + span) % span - span / 2;
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const tt = clock.getElapsedTime() % L;
  const lp = W * tt;

  for (const leg of legs) {
    const u = leg.amp * Math.sin(lp + leg.phase);
    leg.upper.rotation.z = leg.base + u;
    const flex = 0.5 - 0.5 * Math.sin(lp + leg.phase + 1.25);
    leg.knee.rotation.z = leg.flexBase + leg.flexSign * leg.flexAmp * flex;
  }

  horse.position.y = 0.055 * Math.sin(2 * lp);
  horse.rotation.z = 0.045 * Math.sin(lp);
  horse.rotation.x = 0.018 * Math.sin(2 * lp + 1.2);

  neck.rotation.z = -0.55 + 0.035 * Math.sin(lp + 0.5);
  head.rotation.z = 0.05 * Math.sin(lp + 0.95);
  tail.rotation.z = -0.42 + 0.14 * Math.sin(lp + 2.4);
  tail.rotation.y = 0.12 * Math.sin(lp * 0.5 + 1);

  shadow.scale.set(1 + 0.07 * Math.sin(2 * lp), 1, 1 + 0.09 * Math.sin(2 * lp));

  for (const it of items) {
    it.m.position.x = wrap(it.baseX - SPEED * tt, SPAN);
  }
  for (const c of cloudItems) {
    c.m.position.x = wrap(c.baseX + CLOUD_SPEED * tt, CLOUD_SPAN);
  }

  const a = 2 * Math.PI * tt / L + 0.55;
  camera.position.x = 7.6 * Math.sin(a);
  camera.position.z = 7.6 * Math.cos(a);
  camera.position.y = 3.05 + 0.4 * Math.sin(4 * Math.PI * tt / L);
  camera.lookAt(0, 1.2, 0);

  renderer.render(scene, camera);
}
animate();
</script>
