<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="prefetch" href="../claude-sonnet-5.5-high/?v=8c0c7e7647" as="document"><link rel="prefetch" href="../codex-sol-5.6-high/?v=8c0c7e7647" as="document">
  <meta charset="utf-8">
  
  <title>Low-Poly Horse — Running Loop</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #c9e2e8; }
    canvas { display: block; width: 100%; height: 100%; }
    .label {
      position: fixed; left: 20px; bottom: 16px; color: #46616a;
      font: 11px/1.4 system-ui, sans-serif; letter-spacing: .18em;
      text-transform: uppercase; opacity: .72; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="label">A little gallop</div>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xc9e2e8);
    scene.fog = new THREE.Fog(0xc9e2e8, 10, 24);

    const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 2.7, 10.8);
    camera.lookAt(0, 1.35, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xf4fbff, 0x7e6550, 2.0));
    const sun = new THREE.DirectionalLight(0xfff1d5, 3.0);
    sun.position.set(-3, 7, 5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -5;
    sun.shadow.camera.right = 5;
    sun.shadow.camera.top = 5;
    sun.shadow.camera.bottom = -5;
    sun.shadow.bias = -0.0003;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x9cbca4, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    ground.receiveShadow = true;
    scene.add(ground);

    const horse = new THREE.Group();
    scene.add(horse);

    const coat = new THREE.MeshStandardMaterial({ color: 0x9a542f, flatShading: true, roughness: 1 });
    const coatLight = new THREE.MeshStandardMaterial({ color: 0xb36a3b, flatShading: true, roughness: 1 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x38271f, flatShading: true, roughness: 1 });
    const maneMat = new THREE.MeshStandardMaterial({ color: 0x30251f, flatShading: true, roughness: 1 });
    const hoofMat = new THREE.MeshStandardMaterial({ color: 0x292522, flatShading: true, roughness: 1 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x171311, roughness: 1 });
    const muzzleMat = new THREE.MeshStandardMaterial({ color: 0x70402c, flatShading: true, roughness: 1 });

    function makeMesh(geometry, material, parent, position, scale, rotation) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...position);
      if (scale) mesh.scale.set(...scale);
      if (rotation) mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function ico(parent, material, position, scale, detail = 1) {
      return makeMesh(new THREE.IcosahedronGeometry(1, detail), material, parent, position, scale);
    }

    function link(parent, material, a, b, radiusA, radiusB, sides = 5) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const delta = end.clone().sub(start);
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusB, radiusA, delta.length(), sides, 1),
        material
      );
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // Barrel and rump
    ico(horse, coat, [0, 1.56, 0], [0.9, 0.52, 0.34], 2);
    ico(horse, coatLight, [-0.57, 1.59, 0], [0.48, 0.48, 0.36], 1);
    ico(horse, coat, [0.55, 1.58, 0], [0.47, 0.49, 0.35], 1);
    ico(horse, coatLight, [0.05, 1.72, 0], [0.67, 0.42, 0.32], 1);

    // Neck rises forward
    link(horse, coat, [0.43, 1.78, 0], [0.91, 2.55, 0], 0.34, 0.23, 6);
    ico(horse, coatLight, [0.82, 2.19, 0], [0.31, 0.53, 0.30], 1);
    ico(horse, coat, [0.98, 2.62, 0], [0.28, 0.34, 0.26], 1);

    // Head and muzzle
    const head = new THREE.Group();
    head.position.set(1.01, 2.64, 0);
    horse.add(head);
    ico(head, coatLight, [0.13, 0.05, 0], [0.28, 0.39, 0.25], 1);
    link(head, coat, [0.25, -0.06, 0], [0.61, -0.36, 0], 0.18, 0.115, 5);
    ico(head, muzzleMat, [0.63, -0.37, 0], [0.18, 0.13, 0.16], 1);
    // Ears
    link(head, dark, [0.01, 0.31, -0.12], [-0.06, 0.58, -0.14], 0.09, 0.025, 4);
    link(head, dark, [0.12, 0.31, 0.12], [0.09, 0.58, 0.14], 0.09, 0.025, 4);
    // Eyes on either side
    ico(head, eyeMat, [0.19, 0.12, 0.238], [0.045, 0.055, 0.025], 1);
    ico(head, eyeMat, [0.19, 0.12, -0.238], [0.045, 0.055, 0.025], 1);

    // Angular mane tufts along the crest
    for (let i = 0; i < 7; i++) {
      const x = 0.80 - i * 0.115;
      const y = 2.93 - i * 0.105;
      link(horse, maneMat, [x, y, 0], [x - 0.19, y - 0.06, 0], 0.13, 0.025, 4);
    }
    for (let i = 0; i < 3; i++) {
      const x = 0.97 - i * 0.09;
      link(head, maneMat, [x, 0.27, 0], [x - 0.07, 0.08, 0], 0.095, 0.018, 4);
    }

    // Tail, animated as a small chain
    const tail = new THREE.Group();
    tail.position.set(-0.94, 1.91, 0);
    horse.add(tail);
    link(tail, dark, [0, 0, 0], [-0.28, -0.04, 0], 0.12, 0.085, 5);
    link(tail, maneMat, [-0.25, -0.04, 0], [-0.56, -0.11, 0], 0.10, 0.035, 5);
    ico(tail, maneMat, [-0.59, -0.11, 0], [0.12, 0.08, 0.10], 1);

    function makeLeg(x, z, front, phase) {
      const pivot = new THREE.Group();
      pivot.position.set(x, front ? 1.34 : 1.33, z);
      horse.add(pivot);
      const upper = front ? 0.43 : 0.39;
      const lower = front ? 0.42 : 0.45;
      const knee = front ? [front ? -0.06 : 0.12, -upper, 0] : [0.1, -upper, 0];
      const foot = [front ? 0.04 : -0.02, -upper - lower, 0];
      link(pivot, coat, [0, 0, 0], knee, 0.17, 0.095, 5);
      link(pivot, coatLight, knee, foot, 0.095, 0.055, 5);
      ico(pivot, hoofMat, [foot[0] + 0.06, foot[1] - 0.055, 0], [0.12, 0.09, 0.10], 0);
      return { pivot, phase, front };
    }

    const legs = [
      makeLeg(0.53, 0.22, true, 0),
      makeLeg(0.53, -0.22, true, Math.PI),
      makeLeg(-0.58, 0.22, false, Math.PI),
      makeLeg(-0.58, -0.22, false, 0)
    ];

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime() * 5.2;
      horse.position.y = 0.07 + 0.11 * (0.5 + 0.5 * Math.sin(t * 2));
      horse.rotation.z = 0.025 * Math.sin(t * 2);

      for (const leg of legs) {
        const p = t + leg.phase;
        leg.pivot.rotation.z = 0.72 * Math.sin(p);
      }
      head.rotation.z = 0.045 * Math.sin(t * 2 + 0.4);
      tail.rotation.z = 0.28 * Math.sin(t * 2 - 0.5);
      renderer.render(scene, camera);
    }
    animate();

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
