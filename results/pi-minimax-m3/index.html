<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Low-Poly Running Horse</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#b8d4e8;font-family:system-ui,sans-serif}
  #hud{position:absolute;top:12px;left:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);font-size:13px;pointer-events:none;letter-spacing:.3px}
</style>
</head>
<body>
<div id="hud">Low-poly running horse · seamless loop</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const W = () => innerWidth, Hh = () => innerHeight;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8d4e8);
scene.fog = new THREE.Fog(0xb8d4e8, 28, 85);

const camera = new THREE.PerspectiveCamera(42, W()/Hh(), 0.1, 200);
camera.position.set(9.5, 4.3, 10.8);
camera.lookAt(0, 2.3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), Hh());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = W()/Hh();
  camera.updateProjectionMatrix();
  renderer.setSize(W(), Hh());
});

scene.add(new THREE.AmbientLight(0xc0d4e8, 0.5));
scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x6b5a3a, 0.45));
const sun = new THREE.DirectionalLight(0xfff0d6, 1.1);
sun.position.set(12, 18, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 55;
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
sun.shadow.bias = -0.0004;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(160, 160),
  new THREE.MeshStandardMaterial({ color: 0x7fa84a, roughness: 0.95 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const M = {
  body:  new THREE.MeshStandardMaterial({ color: 0x7a4220, roughness: 0.85, flatShading: true }),
  dark:  new THREE.MeshStandardMaterial({ color: 0x2a1808, roughness: 0.9,  flatShading: true }),
  cream: new THREE.MeshStandardMaterial({ color: 0xd6c19a, roughness: 0.9,  flatShading: true }),
  hoof:  new THREE.MeshStandardMaterial({ color: 0x14100a, roughness: 0.7,  flatShading: true }),
  eye:   new THREE.MeshBasicMaterial({ color: 0x080808 })
};

const horse = new THREE.Group();
scene.add(horse);
const body = new THREE.Group();
horse.add(body);

const torso = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.1, 1.0), M.body);
torso.position.set(0, 2.65, 0); torso.castShadow = true; body.add(torso);
const withers = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.28, 0.9), M.body);
withers.position.set(1.0, 3.22, 0); body.add(withers);
const rump = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.15, 1.0), M.body);
rump.position.set(-1.3, 2.7, 0); rump.castShadow = true; body.add(rump);
const chest = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.05, 0.95), M.body);
chest.position.set(1.3, 2.55, 0); chest.castShadow = true; body.add(chest);
const belly = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.28, 0.95), M.cream);
belly.position.set(0.05, 2.05, 0); body.add(belly);

const neckPivot = new THREE.Group();
neckPivot.position.set(1.2, 3.15, 0);
body.add(neckPivot);
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.52, 1.55, 6), M.body);
neck.position.set(0.42, 0.6, 0);
neck.rotation.z = -Math.PI/3.1;
neck.castShadow = true;
neckPivot.add(neck);

const headPivot = new THREE.Group();
headPivot.position.set(1.05, 1.12, 0);
neckPivot.add(headPivot);
const head = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.58, 0.56), M.body);
head.position.set(0.38, 0, 0); head.rotation.z = -0.22; head.castShadow = true; headPivot.add(head);
const snout = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.42, 0.5), M.cream);
snout.position.set(0.82, -0.1, 0); snout.rotation.z = -0.18; snout.castShadow = true; headPivot.add(snout);

const earGeo = new THREE.ConeGeometry(0.1, 0.26, 4);
const earL = new THREE.Mesh(earGeo, M.body);
earL.position.set(0.18, 0.34, 0.2); headPivot.add(earL);
const earR = earL.clone(); earR.position.z = -0.2; headPivot.add(earR);

const eyeGeo = new THREE.SphereGeometry(0.065, 6, 6);
const eyeL = new THREE.Mesh(eyeGeo, M.eye); eyeL.position.set(0.55, 0.06, 0.23); headPivot.add(eyeL);
const eyeR = eyeL.clone(); eyeR.position.z = -0.23; headPivot.add(eyeR);

for (let i=0;i<7;i++){
  const t=i/6;
  const g = new THREE.ConeGeometry(0.14, 0.28, 4);
  const m = new THREE.Mesh(g, M.dark);
  m.position.set(0.08 + t*0.92, 0.55 + t*0.6, 0);
  m.rotation.z = -0.1 - t*0.22;
  m.castShadow = true;
  neckPivot.add(m);
}

function makeLeg(x,z){
  const hip = new THREE.Group();
  hip.position.set(x, 2.2, z);
  body.add(hip);
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.14,1.0,5), M.body);
  upper.position.y=-0.5; upper.castShadow=true; hip.add(upper);
  const knee = new THREE.Group();
  knee.position.y=-0.95; hip.add(knee);
  const kneeBall = new THREE.Mesh(new THREE.SphereGeometry(0.19,5,5), M.body);
  kneeBall.castShadow=true; knee.add(kneeBall);
  const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.09,0.95,5), M.body);
  lower.position.y=-0.47; lower.castShadow=true; knee.add(lower);
  const hoof = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.2,5), M.hoof);
  hoof.position.y=-1.05; hoof.castShadow=true; knee.add(hoof);
  return {hip, knee};
}
const legFL = makeLeg(1.0, 0.34);
const legFR = makeLeg(1.0, -0.34);
const legBL = makeLeg(-1.1, 0.34);
const legBR = makeLeg(-1.1, -0.34);

const tailRoot = new THREE.Group();
tailRoot.position.set(-1.75, 3.05, 0);
body.add(tailRoot);
const tailSegs = [];
let parent = tailRoot;
for (let i=0;i<6;i++){
  const p = new THREE.Group();
  p.position.y = i===0 ? 0 : -0.22;
  parent.add(p);
  const r1 = Math.max(0.16 - i*0.02, 0.04);
  const r2 = Math.max(0.18 - i*0.02, 0.05);
  const seg = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, 0.26, 5), i%2?M.dark:M.body);
  seg.position.y = -0.13; seg.castShadow=true; p.add(seg);
  tailSegs.push(p);
  parent = p;
}
const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.34, 5), M.dark);
tuft.position.y = -0.34; tuft.castShadow=true; parent.add(tuft);

const grassMat = new THREE.MeshStandardMaterial({ color: 0x6b9a3a, flatShading:true });
const grassGeo = new THREE.ConeGeometry(0.07, 0.32, 4);
for (let i=0;i<60;i++){
  const m = new THREE.Mesh(grassGeo, grassMat);
  const a = Math.random()*Math.PI*2;
  const d = 2.5 + Math.random()*26;
  m.position.set(Math.cos(a)*d, 0.16, Math.sin(a)*d);
  m.rotation.y = Math.random()*Math.PI;
  scene.add(m);
}
const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a8079, flatShading:true });
for (let i=0;i<10;i++){
  const r = 0.18+Math.random()*0.4;
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(r,0), rockMat);
  const a = Math.random()*Math.PI*2;
  const d = 4+Math.random()*22;
  m.position.set(Math.cos(a)*d, r*0.55, Math.sin(a)*d);
  m.rotation.set(Math.random(),Math.random(),Math.random());
  m.castShadow=true; m.receiveShadow=true;
  scene.add(m);
}

const clock = new THREE.Clock();
const CYCLE = 1.05;
const W2 = (Math.PI*2)/CYCLE;
const PH = { FL:0, FR:Math.PI*0.5, BR:Math.PI, BL:Math.PI*1.5 };

function animate(){
  const t = clock.getElapsedTime();
  const u = t * W2;

  body.position.y = Math.sin(u*2) * 0.07;
  body.rotation.x = Math.sin(u) * 0.045;
  body.rotation.z = Math.sin(u*0.5) * 0.025;

  neckPivot.rotation.x = Math.sin(u*2 + Math.PI/2) * 0.07;
  neckPivot.rotation.z = Math.sin(u) * 0.05;
  headPivot.rotation.x = Math.sin(u*2) * 0.09;
  headPivot.rotation.y = Math.sin(u) * 0.07;

  earL.rotation.x = Math.sin(u*0.5) * 0.25;
  earR.rotation.x = -Math.sin(u*0.5) * 0.25;

  function setLeg(leg, ph){
    const s = Math.sin(u + ph);
    const lift = Math.max(0, s);
    leg.hip.rotation.z = s * 0.75;
    leg.knee.rotation.z = -lift * 1.35;
  }
  setLeg(legFL, PH.FL);
  setLeg(legFR, PH.FR);
  setLeg(legBL, PH.BL);
  setLeg(legBR, PH.BR);

  for (let i=0;i<tailSegs.length;i++){
    const w = Math.sin(u + i*0.45) * (0.06 + i*0.018);
    tailSegs[i].rotation.x = w;
    tailSegs[i].rotation.z = Math.sin(u*0.5 + i*0.3) * 0.12;
  }
  tuft.rotation.x = Math.sin(u + tailSegs.length*0.45) * 0.18;
  tuft.rotation.z = Math.sin(u*0.5) * 0.22;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
