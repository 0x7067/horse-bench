<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Low-Poly Horse Gallop</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f0; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3f0);
scene.fog = new THREE.Fog(0xbfe3f0, 30, 90);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 3.2, 10);
camera.lookAt(0, 1.4, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdff2ff, 0x8a9a5b, 1.0));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.6);
sun.position.set(6, 12, 4);
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200, 1, 1),
  new THREE.MeshLambertMaterial({ color: 0x7fae56 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Materials
const bodyMat  = new THREE.MeshLambertMaterial({ color: 0x8a5a2b, flatShading: true });
const maneMat  = new THREE.MeshLambertMaterial({ color: 0x3a2a18, flatShading: true });
const hoofMat  = new THREE.MeshLambertMaterial({ color: 0x241a10, flatShading: true });

function box(w, h, d, mat) {
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
}

// ---- Build horse ----
const horse = new THREE.Group();

// Body
const body = box(1.0, 1.0, 2.4, bodyMat);
body.position.y = 1.6;
horse.add(body);

// Chest & rump
const chest = box(1.0, 0.9, 0.6, bodyMat);
chest.position.set(0, 1.65, 1.1);
horse.add(chest);
const rump = box(1.0, 0.9, 0.6, bodyMat);
rump.position.set(0, 1.65, -1.15);
horse.add(rump);

// Neck group (pivot at body front)
const neck = new THREE.Group();
neck.position.set(0, 1.85, 1.25);
horse.add(neck);
const neckMesh = box(0.5, 1.2, 0.55, bodyMat);
neckMesh.position.set(0, 0.55, 0.15);
neckMesh.rotation.x = -0.5;
neck.add(neckMesh);

// Head group
const head = new THREE.Group();
head.position.set(0, 1.05, 0.45);
neck.add(head);
const headMesh = box(0.55, 0.5, 0.9, bodyMat);
headMesh.position.set(0, 0.1, 0.15);
head.add(headMesh);
const muzzle = box(0.4, 0.35, 0.45, bodyMat);
muzzle.position.set(0, -0.02, 0.7);
head.add(muzzle);
// Ears
for (const s of [-1, 1]) {
  const ear = box(0.1, 0.3, 0.08, maneMat);
  ear.position.set(0.18*s, 0.42, -0.1);
  ear.rotation.z = -0.25*s;
  head.add(ear);
}
// Mane
for (let i = 0; i < 5; i++) {
  const tuft = box(0.12, 0.45, 0.15, maneMat);
  tuft.position.set(0, 0.15 - i*0.18, -0.18 - i*0.1);
  tuft.rotation.x = -0.4;
  head.add(tuft);
}

// Tail group
const tail = new THREE.Group();
tail.position.set(0, 1.9, -1.5);
horse.add(tail);
const tailMesh = box(0.22, 1.0, 0.22, maneMat);
tailMesh.position.y = -0.45;
tail.add(tailMesh);

// Legs: upper + lower pivot groups
function makeLeg(x, z) {
  const hip = new THREE.Group();
  hip.position.set(x, 1.3, z);
  horse.add(hip);
  const upper = box(0.28, 0.75, 0.3, bodyMat);
  upper.position.y = -0.35;
  hip.add(upper);
  const knee = new THREE.Group();
  knee.position.y = -0.7;
  hip.add(knee);
  const lower = box(0.2, 0.65, 0.22, bodyMat);
  lower.position.y = -0.3;
  knee.add(lower);
  const hoof = box(0.24, 0.15, 0.26, hoofMat);
  hoof.position.y = -0.68;
  knee.add(hoof);
  return { hip, knee };
}
const legFL = makeLeg(0.42, 0.95);
const legFR = makeLeg(-0.42, 0.95);
const legBL = makeLeg(0.42, -1.0);
const legBR = makeLeg(-0.42, -1.0);

scene.add(horse);

// ---- Animation: gallop cycle, seamless loop ----
const TAU = Math.PI * 2;
function gallop(t) { // t in [0,1)
  const cyc = t * TAU;

  // Body bob + pitch (two beats per cycle)
  body.position.y = 1.6 + 0.18 * Math.sin(2 * cyc);
  chest.position.y = body.position.y + 0.05;
  rump.position.y  = body.position.y + 0.05;
  body.rotation.x = 0.08 * Math.sin(cyc);
  horse.position.y = 0.12 * Math.abs(Math.sin(cyc)); // suspension

  // Legs: diagonal pairs with phase offsets
  function setLeg(leg, phase) {
    const p = cyc + phase;
    leg.hip.rotation.x = 0.7 * Math.sin(p) + 0.25;
    leg.knee.rotation.x = 0.9 * Math.max(0, Math.sin(p + 0.9));
  }
  setLeg(legFL, 0.0);
  setLeg(legFR, Math.PI + 0.3);
  setLeg(legBL, Math.PI + 0.3);
  setLeg(legBR, 0.6);

  // Neck & head bob
  neck.rotation.x = -0.1 + 0.12 * Math.sin(cyc + 1.2);
  head.rotation.x = 0.1 * Math.sin(cyc + 1.8);
  head.rotation.y = 0.06 * Math.sin(cyc);

  // Tail wave
  tail.rotation.x = 0.5 + 0.15 * Math.sin(cyc);
  tail.rotation.z = 0.15 * Math.sin(2 * cyc);
}

const LOOP = 0.75; // seconds per stride cycle
const clock = new THREE.Clock();
let t0 = 0;

function animate() {
  requestAnimationFrame(animate);
  const now = clock.getElapsedTime();
  const t = ((now - t0) % LOOP) / LOOP; // seamless loop
  gallop(t);

  // Gentle camera orbit
  const a = now * 0.15;
  camera.position.set(Math.sin(a) * 10, 3.2, Math.cos(a) * 10);
  camera.lookAt(0, 1.5, 0);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
