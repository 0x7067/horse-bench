<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Low-Poly Galloping Horse</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfdcf0; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfdcf0);
scene.fog = new THREE.Fog(0xbfdcf0, 30, 90);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);

const hemi = new THREE.HemisphereLight(0xd7e9ff, 0x3f5a2a, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2dc, 1.7);
sun.position.set(10, 16, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14;
sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14;
sun.shadow.camera.bottom = -14;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0004;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(70, 40),
  new THREE.MeshStandardMaterial({ color: 0x4d6b33, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const BODY = 0x8a5a2f;
const BODY2 = 0x7a4f2a;
const DARK = 0x2e1c12;
const HOOF = 0x1d120a;
const SNOUT = 0xa97a4a;
const EYE = 0x141414;

function mat(color, rough) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough === undefined ? 0.75 : rough, flatShading: true });
}
const mBody = mat(BODY);
const mBody2 = mat(BODY2);
const mDark = mat(DARK, 0.9);
const mHoof = mat(HOOF, 0.85);
const mSnout = mat(SNOUT, 0.8);
const mEye = mat(EYE, 0.4);

function box(w, h, d, material) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function cone(r, h, seg, material) {
  const mesh = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const horse = new THREE.Group();
scene.add(horse);

const torso = new THREE.Group();
horse.add(torso);

const bodyMesh = box(0.62, 0.66, 1.4, mBody);
torso.add(bodyMesh);

const chest = box(0.5, 0.58, 0.36, mBody2);
chest.position.set(0, -0.02, -0.62);
torso.add(chest);

const rump = box(0.54, 0.56, 0.34, mBody2);
rump.position.set(0, -0.04, 0.62);
torso.add(rump);

const neckGroup = new THREE.Group();
neckGroup.position.set(0, 0.28, -0.56);
neckGroup.rotation.x = -0.72;
torso.add(neckGroup);

const neck = box(0.36, 0.64, 0.36, mBody);
neck.position.set(0, 0.3, 0);
neckGroup.add(neck);

const mane = [];
for (let i = 0; i < 5; i++) {
  const tuft = box(0.09, 0.2, 0.24, mDark);
  tuft.position.set(0, 0.62 - i * 0.13, -0.02);
  tuft.rotation.x = 0.5;
  neckGroup.add(tuft);
  mane.push(tuft);
}

const headGroup = new THREE.Group();
headGroup.position.set(0, 0.62, -0.04);
headGroup.rotation.x = 0.72;
neckGroup.add(headGroup);

const skull = box(0.32, 0.28, 0.46, mBody);
skull.position.set(0, 0.06, -0.1);
headGroup.add(skull);

const snout = box(0.24, 0.2, 0.38, mSnout);
snout.position.set(0, -0.03, -0.44);
headGroup.add(snout);

const forelock = box(0.08, 0.18, 0.2, mDark);
forelock.position.set(0, 0.22, -0.2);
forelock.rotation.x = 0.3;
headGroup.add(forelock);

const earL = cone(0.07, 0.22, 5, mBody);
earL.position.set(-0.1, 0.3, -0.02);
earL.rotation.x = -0.25;
headGroup.add(earL);

const earR = cone(0.07, 0.22, 5, mBody);
earR.position.set(0.1, 0.3, -0.02);
earR.rotation.x = -0.25;
headGroup.add(earR);

const eyeL = box(0.05, 0.06, 0.03, mEye);
eyeL.position.set(-0.14, 0.08, -0.28);
headGroup.add(eyeL);

const eyeR = box(0.05, 0.06, 0.03, mEye);
eyeR.position.set(0.14, 0.08, -0.28);
headGroup.add(eyeR);

const tailGroup = new THREE.Group();
tailGroup.position.set(0, 0.05, 0.72);
torso.add(tailGroup);

const tailBase = box(0.14, 0.14, 0.16, mDark);
tailGroup.add(tailBase);

const tailHair = cone(0.09, 0.8, 5, mDark);
tailHair.position.set(0, -0.35, 0.22);
tailHair.rotation.x = 1.15;
tailGroup.add(tailHair);

const legs = [];
function makeLeg(w, color) {
  const leg = new THREE.Group();
  const upper = box(w, 0.3, w, color);
  upper.position.y = -0.15;
  leg.add(upper);
  const knee = new THREE.Group();
  knee.position.y = -0.3;
  leg.add(knee);
  const lower = box(w * 0.82, 0.3, w * 0.82, color);
  lower.position.y = -0.15;
  knee.add(lower);
  const hoof = box(w * 0.95, 0.1, w * 1.05, mHoof);
  hoof.position.y = -0.35;
  knee.add(hoof);
  return { leg, knee };
}

const frontL = makeLeg(0.17, mBody2);
frontL.leg.position.set(-0.26, 0.7, -0.42);
horse.add(frontL.leg);
legs.push(frontL);

const frontR = makeLeg(0.17, mBody2);
frontR.leg.position.set(0.26, 0.7, -0.42);
horse.add(frontR.leg);
legs.push(frontR);

const hindL = makeLeg(0.19, mBody);
hindL.leg.position.set(-0.27, 0.7, 0.42);
horse.add(hindL.leg);
legs.push(hindL);

const hindR = makeLeg(0.19, mBody);
hindR.leg.position.set(0.27, 0.7, 0.42);
horse.add(hindR.leg);
legs.push(hindR);

const scenery = [];
function makeScenery() {
  const group = new THREE.Group();
  const kind = Math.floor(Math.random() * 3);
  let mesh;
  if (kind === 0) {
    mesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.25 + Math.random() * 0.25, 0),
      mat(0x6e6e6e, 1)
    );
    mesh.position.y = 0.18;
  } else if (kind === 1) {
    mesh = cone(0.22 + Math.random() * 0.18, 0.5 + Math.random() * 0.5, 6, mat(0x3f6b2a, 1));
    mesh.position.y = 0.3;
  } else {
    mesh = box(0.14, 0.7 + Math.random() * 0.4, 0.14, mat(0x8a6a3a, 1));
    mesh.position.y = 0.4;
  }
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);
  group.position.set(
    (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 6),
    0,
    -40 + Math.random() * 52
  );
  const scale = 0.8 + Math.random() * 0.8;
  group.scale.setScalar(scale);
  scene.add(group);
  return group;
}

for (let i = 0; i < 22; i++) scenery.push(makeScenery());

const GAIT = 0.82;
const W = (Math.PI * 2) / GAIT;
const SPEED = 7;
const WRAP_LO = -44;
const WRAP_HI = 14;
const WRAP_SPAN = WRAP_HI - WRAP_LO;

const clock = new THREE.Clock();
let t = 0;
let orbit = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  orbit += dt * 0.14;

  const th = t * W;

  const frontSwing = Math.sin(th);
  const hindSwing = Math.sin(th + Math.PI);

  legs.forEach((L, i) => {
    const isHind = i >= 2;
    const swing = isHind ? hindSwing : frontSwing;
    L.leg.rotation.x = swing * 0.68;
    const fold = Math.max(0, -swing);
    L.knee.rotation.x = fold * 1.05;
  });

  horse.position.y = 0.05 * Math.sin(2 * th);

  torso.rotation.x = -0.06 + 0.1 * Math.sin(th + 0.35);
  torso.rotation.z = 0.03 * Math.sin(th + 0.7);

  headGroup.rotation.x = 0.72 - 0.12 * Math.sin(th + 0.35) + 0.05 * Math.sin(2 * th + 0.4);

  tailGroup.rotation.y = 0.22 * Math.sin(th + 1.1);
  tailGroup.rotation.x = 0.1 + 0.16 * Math.sin(2 * th + 0.6);

  for (const s of scenery) {
    s.position.z += SPEED * dt;
    if (s.position.z > WRAP_HI) s.position.z -= WRAP_SPAN;
  }

  const radius = 8.4;
  camera.position.set(
    Math.sin(orbit) * radius,
    3.1 + 0.05 * Math.sin(2 * th),
    Math.cos(orbit) * radius
  );
  camera.lookAt(0, 1.05, 0);

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
